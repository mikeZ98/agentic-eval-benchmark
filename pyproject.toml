[project]
name = "agentic-eval-benchmark"
version = "0.1.0"
description = "LLM-as-a-Judge evaluation pipeline for external RAG endpoints: Ragas/TruLens metrics over synthetic Golden Datasets with strict quality gates."
readme = "README.md"
license = "MIT"
authors = [{ name = "mikeZ98", email = "145975972+mikeZ98@users.noreply.github.com" }]
requires-python = ">=3.13,<3.14"
classifiers = [
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "Framework :: Pydantic :: 2",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  # Contracts, settings, API and CLI
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "fastapi>=0.120",
  "uvicorn[standard]>=0.35",
  "typer>=0.20",
  "httpx>=0.28",
  "structlog>=25.4",
  # Evaluation suite (LLM-as-a-Judge)
  "ragas>=0.4.3,<0.5",
  "trulens-core>=2.16,<3",
  "trulens-feedback>=2.16,<3",
  "trulens-providers-openai>=2.16,<3",
  "openai>=1.100",
  # Tabular export of run summaries
  "pyarrow>=21",
]

[project.scripts]
agentic-eval = "agentic_eval_benchmark.cli:main"

[project.optional-dependencies]
# Anthropic judge models through ragas_llm(..., provider="anthropic"). Capped below 2.0:
# that major release is days old and predates the instructor version ragas resolves.
anthropic = ["anthropic>=0.70,<2"]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.2",
  "pytest-cov>=7.0",
  "pytest-httpx>=0.35",
  "pytest-socket>=0.7",
  "hypothesis>=6.140",
  "ruff>=0.14",
  "mypy>=1.18",
  "bandit[toml]>=1.8",
]

[tool.uv]
default-groups = ["dev"]
# ragas 0.4.3 imports langchain_community.chat_models.vertexai at import time;
# langchain-community 0.4.2 removed that module. Lift once ragas drops the import.
constraint-dependencies = ["langchain-community>=0.4.1,<0.4.2"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_eval_benchmark"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "S", "SIM", "PT", "RET",
  "ARG", "PTH", "PL", "RUF", "ASYNC", "TRY", "PERF", "FBT", "T20", "BLE", "ERA",
]
ignore = ["PLR0913", "TRY003"]

[tool.ruff.lint.per-file-ignores]
# Test doubles mirror callback signatures (unused args); test data holds typographic quotes.
"tests/**" = ["S101", "S105", "S106", "PLR2004", "ARG001", "ARG002", "ARG005", "FBT", "PLR0917", "RUF001"]
# Typer maps every option to a keyword parameter with a default, flags included.
"src/agentic_eval_benchmark/cli.py" = ["FBT001", "FBT002", "PLR0917"]

[tool.ruff.lint.isort]
known-first-party = ["agentic_eval_benchmark"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
cache_dir = ".cache/mypy"
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["ragas.*", "trulens.*", "datasets.*", "pyarrow.*", "anthropic.*", "nltk.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Pytest / coverage (hermetic: sockets disabled, no live judge or RAG calls)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
cache_dir = ".cache/pytest"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--disable-socket",
  "--allow-unix-socket",
  "--cov=agentic_eval_benchmark",
  "--cov-branch",
  "--cov-report=term-missing",
]
filterwarnings = [
  "error",
  # TruLens' Pace creates an event loop in each worker thread that calls a provider and
  # never closes it (trulens/core/utils/pace.py); its self-pipe is an AF_UNIX socketpair.
  "ignore:unclosed event loop:ResourceWarning",
  # ... and calls asyncio.get_event_loop() from the main thread when building an endpoint.
  "ignore:There is no current event loop:DeprecationWarning:trulens\\..*",
  "ignore:Exception ignored in. <function BaseEventLoop.__del__:pytest.PytestUnraisableExceptionWarning",
  "ignore:Exception ignored in. <pytest_socket.disable_socket.<locals>.GuardedSocket fd=[0-9]+, family=1,:pytest.PytestUnraisableExceptionWarning",
  # TruLens' database layer (alembic migrations on session open) leaves sqlite3
  # connections to the garbage collector. This package never opens sqlite3 itself.
  "ignore:unclosed database in <sqlite3.Connection:ResourceWarning",
  "ignore:Exception ignored in. <sqlite3.Connection object:pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["agentic_eval_benchmark"]
data_file = ".cache/coverage/.coverage"

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "if __name__ == .__main__.:",
]

# ---------------------------------------------------------------------------
# Bandit
# ---------------------------------------------------------------------------
[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", ".cache"]
